# Config de referência do nginx para api.melbrai.com.br.
# Na VPS: copiar para /etc/nginx/sites-available/api.melbrai.com.br,
# criar o link simbólico em sites-enabled e rodar certbot (ver
# docs/CURRENT_STATE.md, seção "Backend de comando de voz por IA", para o
# passo a passo completo). O bloco "listen 443" abaixo é preenchido
# automaticamente pelo certbot --nginx na primeira execução.

server {
    listen 80;
    server_name api.melbrai.com.br;

    location / {
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
