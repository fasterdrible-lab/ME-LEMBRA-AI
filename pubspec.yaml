name: me_lembra_ai
description: A new Flutter project.

publish_to: 'none'

version: 1.4.1+16

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  shared_preferences: ^2.2.2
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.0
  cloud_firestore: ^5.4.0
  firebase_messaging: ^15.1.0
  flutter_local_notifications: ^17.2.2
  timezone: ^0.9.4

  flutter_tts: ^4.0.2

  speech_to_text: ^7.3.0

  geolocator: ^12.0.0
  permission_handler: ^11.3.1
  sensors_plus: ^4.0.2
  url_launcher: ^6.3.0
  package_info_plus: ^8.0.0
  firebase_storage: ^12.3.0
  record: ^6.0.0
  audioplayers: ^6.1.0
  path_provider: ^2.1.4
  intl: ^0.19.0
  google_maps_flutter: ^2.9.0
  http: ^1.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.14.1

# flutter_launcher_icons configuration
# Place your app icon PNG (at least 1024x1024px) at: assets/icon/app_icon.png
# Then run: flutter pub run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#FFB800"
  adaptive_icon_foreground: "assets/icon/app_icon.png"

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icon/
